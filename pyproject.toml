[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-network-simulator"
version = "0.1.0"
description = "Simulador de redes móveis: modelos de antena Omni, Setorial, SMB e MRC adaptativo"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
