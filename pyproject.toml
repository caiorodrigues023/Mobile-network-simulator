[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-network-simulator"
version = "0.2.0"
description = "Simulador híbrido de redes móveis (antenas, beamforming, controle de potência, mobilidade, SDMA e handover) com interface web Streamlit + Plotly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "plotly>=5.20.0",
    "pandas>=2.2.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
